# Region pack skeleton. Create a real pack with:
#     python tools/new_region.py my_region "My Region Name"
# then follow regions/README.md. Everything below is region-specific; nothing here needs a
# code change.

id: __REGION_ID__               # must equal the folder name (lowercase letters, digits, _ or -)
name: __REGION_NAME__           # shown in the UI and written to usage / false-positive logs
description: Describe this region / product line here

products:                       # "Product" choices offered at upload time
  - { id: standard, label: standard, date_updated: "0" }   # date_updated: value for date.updated on new traced elements; optional folder_keywords: [..] for batch-folder runs

# DTDs live in ./dtd. ORDER MATTERS: a document's DOCTYPE path is matched against each
# family's doctype_keywords in this order, first hit wins - put specific names before
# generic ones. `selectable: true` families appear in the tag palette / DTD-validator dropdown.
dtd:
  default_family: main          # used when the DOCTYPE matches nothing
  entities_file: ""             # optional: shared entities .dtd inside ./dtd
  families:
    - id: main
      file: main.dtd            # <- drop your DTD file into ./dtd with this name
      label: "Main DTD"
      doctype_keywords: [main]  # words that appear in the DOCTYPE SYSTEM path of this DTD's documents
      rules_family: main        # which rules/*.{family}.md snippets this family uses
      citation_style: cite      # "cite" = <cite type="..">   |   "bare" = <cc>, <st>, ... tags
      selectable: true

# Tagging prompt per product (files in ./prompts); `fallbacks` are tried if one is missing.
tagging_prompts:
  standard: Tagging_Prompt.md
  fallbacks: [Tagging_Prompt.md]

# Rule snippets injected into the prompts ({{XML_ENTITY_RULES}}, {{CASE_CITATION_RULES}},
# {{URL_TAGGING_RULES}}). Files live in ./rules; {family} = the DTD family's rules_family.
rules:
  entity_rules: entity_rules.md
  citation_rules: "citation_rules.{family}.md"
  url_rules: "url_rules.{family}.md"

# Only needed when a family uses citation_style: bare - maps <cite type="X"> examples in the
# shared prompts to that family's bare tags.
citation_tag_map: {}

# (Feedback logs -- false positives, corrections, resolver runs, triage reports -- are stored in the
# S3 bucket under feedback/<region id>/, so each region is kept apart automatically.)

# Validation tweaks.
validation:
  # Tags that never raise DTD / unknown-element errors (new structural tags being rolled out).
  allowed_tags: []

