version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PIPELINE_MAX_WORKERS=6
      # All persistent state lives in this S3 bucket (credentials: the host's IAM role, or the
      # standard AWS_* variables from .env for local runs). No volume needed: /tmp is only scratch.
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-a209309-s3-cdntrackchanges-653514985368-us-east-1-an}
    # static_react:app serves the FastAPI backend AND the built React frontend.
    command: uvicorn static_react:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: "4"

  streamlit:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-a209309-s3-cdntrackchanges-653514985368-us-east-1-an}
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"
