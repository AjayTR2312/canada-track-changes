# The pods talk to S3 with this ServiceAccount's IAM role -- no access keys anywhere.
#
# EKS: create an IAM role that trusts the cluster's OIDC provider (IRSA) -- or use EKS Pod Identity --
# and give it the policy in k8s/s3-policy.json for the bucket below. Then put the role ARN here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pxml-pipeline
  namespace: pxml-pipeline
  annotations:
    # IRSA only (delete this line if you use Pod Identity or node/instance roles):
    eks.amazonaws.com/role-arn: arn:aws:iam::653514985368:role/REPLACE-WITH-YOUR-PXML-PIPELINE-ROLE
