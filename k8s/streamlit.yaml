apiVersion: apps/v1
kind: Deployment
metadata:
  name: pxml-streamlit
  namespace: pxml-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pxml-streamlit
  template:
    metadata:
      labels:
        app: pxml-streamlit
    spec:
      containers:
        - name: streamlit
          image: pxml-pipeline:latest
          command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://pxml-api.pxml-pipeline.svc.cluster.local:8000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: pxml-streamlit
  namespace: pxml-pipeline
spec:
  type: LoadBalancer
  selector:
    app: pxml-streamlit
  ports:
    - port: 8501
      targetPort: 8501
