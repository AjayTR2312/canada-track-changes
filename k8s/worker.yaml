apiVersion: apps/v1
kind: Deployment
metadata:
  name: pxml-worker
  namespace: pxml-pipeline
spec:
  replicas: 3  # Scale up/down based on load (3 workers = ~6 concurrent jobs)
  selector:
    matchLabels:
      app: pxml-worker
  template:
    metadata:
      labels:
        app: pxml-worker
    spec:
      containers:
        - name: worker
          image: pxml-pipeline:latest  # Same image as API
          command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=2"]
          env:
            - name: REDIS_URL
              value: "redis://redis.pxml-pipeline.svc.cluster.local:6379/0"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: job-data
              mountPath: /tmp/pxml_pipeline_jobs
      volumes:
        - name: job-data
          persistentVolumeClaim:
            claimName: job-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: job-data-pvc
  namespace: pxml-pipeline
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods need access
  resources:
    requests:
      storage: 10Gi
