# API (FastAPI + in-pod worker pool).
#
# Stateless: every record that must outlive a pod (jobs, batches, validation sessions, uploads/outputs,
# users, usage, feedback logs) is in the S3 bucket, so replicas can be added, killed or rescheduled
# freely and any replica can answer for any job. The only local disk is scratch (/tmp, an emptyDir).
#
# A pipeline run that is IN FLIGHT inside a pod that is killed stops; it is reported as "interrupted"
# (the pod marks it on a graceful shutdown, other pods notice a stale heartbeat otherwise) and can be
# re-run from its inputs, which are already in S3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pxml-api
  namespace: pxml-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pxml-api
  template:
    metadata:
      labels:
        app: pxml-api
    spec:
      serviceAccountName: pxml-pipeline
      # Time for the shutdown hook to mark running jobs as interrupted.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1234
        runAsGroup: 1234
        fsGroup: 1234
      containers:
        - name: api
          image: pxml-pipeline:latest  # Replace with your registry image
          command: ["uvicorn", "pipeline_api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: S3_BUCKET_NAME
              value: "a209309-s3-cdntrackchanges-653514985368-us-east-1-an"
            - name: AWS_REGION
              value: "us-east-1"
            - name: PIPELINE_MAX_WORKERS
              value: "6"
            - name: REGION_ID
              value: "canada"
          # LLM / e-mail credentials: put them in a Secret (or keep the baked .env) -- NOT AWS keys.
          envFrom:
            - secretRef:
                name: pxml-secrets
                optional: true
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "16Gi"
              cpu: "4"
          volumeMounts:
            - name: scratch
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: scratch              # throw-away job workspaces; S3 holds the real copies
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pxml-api
  namespace: pxml-pipeline
spec:
  type: ClusterIP   # or LoadBalancer / Ingress
  selector:
    app: pxml-api
  ports:
    - port: 8000
      targetPort: 8000
